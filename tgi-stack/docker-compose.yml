version: '3'
networks:
 loki:
services:
  influxdb:
    image: influxdb:2.7.5
    container_name: influxdb
    ports:
      - 8086:8086
    volumes:
      - /data/tgi-stack/influxdb:/var/lib/influxdb
    restart: unless-stopped
    networks:
      - loki
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    user: "1000:0"
    ports:
      - "3001:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - /data/tgi-stack/tls/grafana:/etc/grafana/tls:ro
    environment:
      GF_SERVER_PROTOCOL: "https"
      GF_SERVER_DOMAIN: "${GRAFANA_HOSTNAME}"
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL}"
      GF_SERVER_CERT_FILE: "/etc/grafana/tls/fullchain.pem"
      GF_SERVER_CERT_KEY: "/etc/grafana/tls/privkey.pem"
      GF_SERVER_CERTS_WATCH_INTERVAL: "5m"
    restart: unless-stopped
    networks:
      - loki
  loki:
    image: grafana/loki:latest
    container_name: loki
    volumes:
      - /data/tgi-stack/loki:/etc/loki
    ports:
      - 3100:3100
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - loki
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - /var/log:/var/log
      - /data/tgi-stack/promtail:/etc/promtail
    # ports:
    #   - "1514:1514" # this is only needed if you are going to send syslogs
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    networks:
      - loki
volumes:
  grafana-storage:
